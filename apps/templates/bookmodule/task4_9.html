<!DOCTYPE html>
<html>
<head>
    <title>Task 4</title>
</head>
<body>

<h2>Book Prices Statistics</h2>

<table border="1">
<tr>
    <th>Publisher</th>
    <th>Average Price</th>
    <th>Min Price</th>
    <th>Max Price</th>
</tr>

{% for p in publishers %}
<tr>
    <td>{{ p.name }}</td>
    <td>{{ p.avg_price }}</td>
    <td>{{ p.min_price }}</td>
    <td>{{ p.max_price }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
